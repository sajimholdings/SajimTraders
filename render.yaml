services:
  - type: web
    name: sajim-traders
    runtime: python
    plan: starter
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn web.app:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ADMIN_KEY
        sync: false
      # Dedicated secret for encrypting stored MT5 passwords (required by /api/client/connect).
      # Must be identical on the bridge supervisor host. Generate with:
      #   python -c "import secrets; print(secrets.token_urlsafe(48))"
      - key: CREDENTIAL_ENCRYPTION_KEY
        sync: false
      # NOTE: the cTrader bridge (core/ctrader_bridge.py) is a non-functional stub and no
      # code reads BROKER_BACKEND; execution runs through the MT5 bridge workers only.
      # Re-add CTRADER_CLIENT_ID / CTRADER_CLIENT_SECRET / CTRADER_ACCESS_TOKEN /
      # CTRADER_ACCOUNT_ID / CTRADER_ENVIRONMENT here once that integration is real.
